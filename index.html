<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>賴打下班沒</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; color: #333; }
        .card { background: white; padding: 25px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; max-width: 90%; }
        button { background-color: #ff4757; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background-color: #ff6b81; }
        #status { margin-top: 15px; font-weight: bold; color: #2ed573; min-height: 24px; }
        .stats-box { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-top: 20px; text-align: left; border: 1px solid #e9ecef; }
        .stats-box h3 { margin-top: 0; font-size: 16px; color: #495057; border-bottom: 2px solid #dee2e6; padding-bottom: 5px; }
        .stat-item { margin: 10px 0; font-size: 14px; }
        .stat-value { font-weight: bold; color: #3b82f6; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔥 賴打今天下班了嗎？</h2>
        <button onclick="recordOffWork()">下班了</button>
        <div id="status"></div>

        <div class="stats-box">
            <h3>📊 數據統計</h3>
            <div class="stat-item">今天下班時間：<span id="todayTime" class="stat-value">尚未記錄</span></div>
            <div class="stat-item">昨天下班時間：<span id="yesterdayTime" class="stat-value">無紀錄</span></div>
            <div class="stat-item">近七天平均下班：<span id="avgTime" class="stat-value">計算中...</span></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwkAso0PZ5Qcvs4cyL9yQZunqCreS4P5v7y_0zga29GNGecmiIc_yMUliF1hrN3a5QyeA/exec';

        window.onload = function() {
            fetchStats();
        };

        function recordOffWork() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = '傳送中...';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'note=手動回報'
            })
            .then(() => {
                statusDiv.innerText = '✨ 成功記錄！';
                setTimeout(() => { 
                    statusDiv.innerText = ''; 
                    fetchStats(); 
                }, 2000);
            })
            .catch(error => {
                console.error('Error:', error);
                statusDiv.style.color = 'red';
                statusDiv.innerText = '❌ 記錄失敗';
            });
        }

        function fetchStats() {
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    if (!data || !Array.isArray(data) || data.length === 0) return;

                    const now = new Date();
                    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

                    const yesterday = new Date();
                    yesterday.setDate(now.getDate() - 1);
                    const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;

                    // 用來記錄每一天「最後一筆」的分鐘數物件 { "2026-07-28": 953, "2026-07-27": 1020, ... }
                    let dailyLastMinutes = {};
                    let todayLast = null;
                    let yesterdayLast = null;

                    data.forEach(item => {
                        if (!item.time) return;

                        let timeStr = String(item.time).trim();
                        let datePart = "";
                        let timePart = "";
                        let itemMinutes = 0;

                        if (timeStr.includes('T')) {
                            let itemDate = new Date(timeStr);
                            if (isNaN(itemDate.getTime())) return;
                            
                            let utcTime = itemDate.getTime();
                            let twDate = new Date(utcTime + (8 * 60 * 60 * 1000));

                            let y = twDate.getUTCFullYear();
                            let m = String(twDate.getUTCMonth() + 1).padStart(2, '0');
                            let d = String(twDate.getUTCDate()).padStart(2, '0');
                            datePart = `${y}-${m}-${d}`;

                            let hh = String(twDate.getUTCHours()).padStart(2, '0');
                            let mm = String(twDate.getUTCMinutes()).padStart(2, '0');
                            let ss = String(twDate.getUTCSeconds()).padStart(2, '0');
                            timePart = `${hh}:${mm}:${ss}`;

                            itemMinutes = twDate.getUTCHours() * 60 + twDate.getUTCMinutes();
                        } else {
                            let parts = timeStr.split(' ');
                            if (parts.length < 2) return;
                            datePart = parts[0];
                            timePart = parts[1];

                            let tParts = timePart.split(':');
                            if (tParts.length >= 2) {
                                itemMinutes = parseInt(tParts[0]) * 60 + parseInt(tParts[1]);
                            }
                        }

                        // 獨立指定今天與昨天
                        if (datePart === todayStr) {
                            todayLast = timePart;
                        }
                        if (datePart === yesterdayStr) {
                            yesterdayLast = timePart;
                        }

                        // 每一天持續覆蓋，確保最後留下的都是該天最後一筆的時間（以分鐘計算）
                        dailyLastMinutes[datePart] = itemMinutes;
                    });

                    // 更新畫面：今天與昨天
                    document.getElementById('todayTime').innerText = todayLast ? todayLast : '尚未記錄';
                    document.getElementById('yesterdayTime').innerText = yesterdayLast ? yesterdayLast : '無紀錄';

                    // 計算「最近 7 天內」每天最後一筆的平均值
                    let last7DaysMinutes = [];
                    for (let i = 0; i < 7; i++) {
                        let d = new Date();
                        d.setDate(now.getDate() - i);
                        let dStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        
                        // 如果這一天有記錄到下班時間（取當天最後一筆）
                        if (dailyLastMinutes[dStr] !== undefined) {
                            last7DaysMinutes.push(dailyLastMinutes[dStr]);
                        }
                    }

                    if (last7DaysMinutes.length > 0) {
                        const totalMinutes = last7DaysMinutes.reduce((a, b) => a + b, 0);
                        const avgMinutes = Math.round(totalMinutes / last7DaysMinutes.length);
                        const avgHour = String(Math.floor(avgMinutes / 60)).padStart(2, '0');
                        const avgMin = String(avgMinutes % 60).padStart(2, '0');
                        document.getElementById('avgTime').innerText = `${avgHour}:${avgMin} (共統計 ${last7DaysDaysCheck(last7DaysMinutes.length)} 天)`; // 簡單修正字串
                    } else {
                        document.getElementById('avgTime').innerText = '資料不足';
                    }
                })
                .catch(err => {
                    console.error('無法取得統計數據', err);
                });
        }
        
        // 輔助顯示天數的簡易函式
        function last7DaysDaysCheck(len) {
            return len;
        }
    </script>
</body>
</html>
