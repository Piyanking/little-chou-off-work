<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>小舟下班即時回報系統</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { background-color: #ff4757; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #ff6b81; }
        #status { margin-top: 20px; font-weight: bold; color: #2ed573; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚨 小舟今天下班了嗎？</h2>
        <p>確認小舟離開，請大聲按下按鈕！</p>
        <button onclick="recordOffWork()">回報小舟已下班！</button>
        <div id="status"></div>
    </div>

    <script>
        // 請將下方引號內的網址替換為你在 Google Apps Script 部署取得的網址
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwkAso0PZ5Qcvs4cyL9yQZunqCreS4P5v7y_0zga29GNGecmiIc_yMUliF1hrN3a5QyeA/exec';

        function recordOffWork() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = '傳送中...';

            // 發送請求給 Google Apps Script
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // Google Apps Script 跨域限制通常需設定 no-cors 或透過表單送出
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'note=手動回報'
            })
            .then(() => {
                statusDiv.innerText = '✨ 成功記錄！已同步至 Google 試算表';
                setTimeout(() => { statusDiv.innerText = ''; }, 4000);
            })
            .catch(error => {
                console.error('Error:', error);
                statusDiv.style.color = 'red';
                statusDiv.innerText = '❌ 記錄失敗，請檢查網路或網址';
            });
        }
    </script>

</body>
</html>
